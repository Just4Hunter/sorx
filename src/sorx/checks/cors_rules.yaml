rules:
  ###########################################
  ## Wildcard Origin ########################
  ###########################################

  - id: CORS-001
    title: Wildcard origin
    severity: info
    description: >
      The server allows requests from any origin using a wildcard
      Access-Control-Allow-Origin value.
    evidence: >
      Access-Control-Allow-Origin is set to '*'.
    suggestion: |
      Try payload `Origin: https://attacker.example`.
      Check whether sensitive data is accessible cross-origin without credentials.
    example:
      response: |
        Access-Control-Allow-Origin: *


  ###########################################
  ## Origin Reflection ######################
  ###########################################

  - id: CORS-100
    title: Attacker origin reflected
    severity: info
    description: >
      The server reflects an attacker-controlled origin in the
      Access-Control-Allow-Origin response header.
    evidence: >
      The supplied Origin value is reflected in
      Access-Control-Allow-Origin.
    suggestion: |
      Try payload `Origin: https://attacker.example`.
      Check whether sensitive response data is readable from an attacker-controlled origin.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example


  - id: CORS-101
    title: Attacker origin reflected with credentials
    severity: high
    description: >
      The server reflects an attacker-controlled origin and allows
      credentials for cross-origin requests.
    evidence: >
      The supplied Origin value is reflected in
      Access-Control-Allow-Origin and
      Access-Control-Allow-Credentials is set to true.
    suggestion: |
      Try payload `Origin: https://attacker.example` with credentials.
      Check whether authenticated responses containing sensitive data are readable cross-origin.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true



  ###########################################
  ## Null Origin ############################
  ###########################################

  - id: CORS-200
    title: Null origin with credentials
    severity: high
    description: >
      The server allows the null origin and credentials for
      cross-origin requests.
    evidence: >
      Access-Control-Allow-Origin is set to 'null' and
      Access-Control-Allow-Credentials is set to true.
    suggestion: |
      Try payload `Origin: null`.
      Check whether authenticated data is readable cross-origin.
    example:
      request: |
        Origin: null
      response: |
        Access-Control-Allow-Origin: null
        Access-Control-Allow-Credentials: true

  - id: CORS-201
    title: Null origin allowed
    severity: medium
    description: >
      The server explicitly allows the null origin for
      cross-origin requests.
    evidence: >
      Access-Control-Allow-Origin is set to 'null'.
    suggestion: |
      Try payload `Origin: null`.
      Check whether sensitive data is readable cross-origin.
    example:
      request: |
        Origin: null
      response: |
        Access-Control-Allow-Origin: null


  ###########################################
  ## Preflight / Request Permissions ########
  ###########################################

  - id: CORS-300
    title: Sensitive request header allowed
    severity: info
    description: >
      The CORS policy allows a sensitive request header such as
      Authorization.
    evidence: >
      A sensitive request header such as Authorization is included
      in Access-Control-Allow-Headers.
    suggestion: |
      Try payload `Access-Control-Request-Headers: Authorization`.
      Check whether the header is accepted during preflight.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: GET
        Access-Control-Request-Headers: Authorization
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Headers: Authorization

  - id: CORS-301
    title: Wildcard request headers
    severity: info
    description: >
      The server allows arbitrary request headers through a wildcard
      Access-Control-Allow-Headers value.
    evidence: >
      Access-Control-Allow-Headers is set to '*'.
    suggestion: |
      Try payload `Access-Control-Request-Headers: Authorization` or any sensitive request header.
      Check whether the header is accepted during preflight.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Headers: X-Custom-Header
      response: |
        Access-Control-Allow-Headers: *

  - id: CORS-302
    title: Wildcard request methods
    severity: info
    description: >
      The server allows arbitrary HTTP methods through a wildcard
      Access-Control-Allow-Methods value.
    evidence: >
      Access-Control-Allow-Methods is set to '*'.
    suggestion: |
      Try payload `Access-Control-Request-Method: DELETE` or any state-changing HTTP method.
      Check whether the method is allowed during preflight.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: DELETE
      response: |
        Access-Control-Allow-Methods: *

  - id: CORS-303
    title: Dynamic request method reflection
    severity: info
    description: >
      The server dynamically reflects the requested HTTP method in
      Access-Control-Allow-Methods during CORS preflight requests.
    evidence: >
      The requested method is included in Access-Control-Allow-Methods
      in response to the corresponding Access-Control-Request-Method.
    suggestion: |
      Try payload `Access-Control-Request-Method: DELETE` or any non-simple HTTP method.
      Check whether the requested method is reflected.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: DELETE
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Methods: DELETE


  - id: CORS-304
    title: Dynamic request header reflection
    severity: info
    description: >
      The server dynamically reflects requested headers in
      Access-Control-Allow-Headers during CORS preflight requests.
    evidence: >
      The requested header is included in Access-Control-Allow-Headers
      in response to the corresponding Access-Control-Request-Headers.
    suggestion: |
      Try payload `Access-Control-Request-Headers: Authorization` or any custom request header.
      Check whether the requested header is reflected.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: POST
        Access-Control-Request-Headers: X-Custom-Header
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Headers: X-Custom-Header


  - id: CORS-305
    title: Dynamic origin reflection without Vary
    severity: low
    description: >
      The server dynamically reflects the Origin in
      Access-Control-Allow-Origin but does not include Vary: Origin,
      which may cause incorrect caching of CORS responses.
    evidence: >
      Access-Control-Allow-Origin reflects the supplied Origin while
      the response does not include Vary: Origin.
    suggestion: |
      Try payload `Origin: https://attacker.example` or any attacker-controlled origin.
      Check whether a cached response from one origin is served to another.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example


  ###########################################
  ## Exposed Response Headers ##############
  ###########################################

  - id: CORS-400
    title: Sensitive response header exposed
    severity: medium
    description: >
      The server exposes a potentially sensitive response header
      through Access-Control-Expose-Headers.
    evidence: >
      A potentially sensitive response header is included in
      Access-Control-Expose-Headers.
    suggestion: |
      Try exposed headers such as `X-Auth-Token` or `X-API-Key`.
      Check whether their values contain sensitive information.
    example:
      response: |
        Access-Control-Expose-Headers: X-Auth-Token


  ###########################################
  ## Origin Validation Bypass ###############
  ###########################################

  - id: CORS-500
    title: Trusted origin validation bypass
    severity: high
    description: >
      The server validates the Origin against a trusted domain using
      an insecure suffix or partial-domain comparison. An attacker
      can register a domain whose hostname ends with the trusted
      domain and have the server treat it as trusted.
    evidence: >
      The supplied attacker-controlled Origin is reflected in
      Access-Control-Allow-Origin and
      Access-Control-Allow-Credentials is set to true, even though
      the origin is not an actual subdomain of the trusted domain.
    suggestion: |
      Try payload `Origin: https://attackerexample.com` or `Origin: https://example.com.attacker.example`.
      Check whether the attacker-controlled origin is accepted as trusted.
    note: >
      A hostname such as attackerexample.com may satisfy a naive
      check such as hostname.endswith("example.com"), while it is
      not a subdomain of example.com.
    example:
      request: |
        Origin: https://attackerexample.com
      response: |
        Access-Control-Allow-Origin: https://attackerexample.com
        Access-Control-Allow-Credentials: true


  - id: CORS-501
    title: Trusted subdomain validation bypass
    severity: high
    description: >
      The server attempts to restrict CORS to a trusted domain or
      its subdomains, but performs the validation using an unsafe
      hostname suffix comparison.
    evidence: >
      An attacker-controlled hostname containing the trusted domain
      as a suffix is accepted and reflected as the allowed origin.
    suggestion: |
      Try payload `Origin: https://attackerexample.com` or any hostname variation that places the trusted domain outside a valid subdomain boundary.
      Check whether the origin is incorrectly accepted as trusted.
    note: >
      For example, attacker.example.com may be a legitimate
      subdomain, while attackerexample.com is a different domain.
    example:
      request: |
        Origin: https://attackerexample.com
      response: |
        Access-Control-Allow-Origin: https://attackerexample.com
        Access-Control-Allow-Credentials: true


  ###########################################
  ## CORS Combinations ######################
  ###########################################

  - id: CORS-900
    title: Origin reflection with credentials and Authorization
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and permits the Authorization request header.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and Authorization is permitted by Access-Control-Allow-Headers.
    suggestion: |
      Try payload `Origin: https://attacker.example` with an authenticated request.
      Check whether sensitive data can be read cross-origin using the allowed Authorization header.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Headers: Authorization
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Allow-Headers: Authorization


  - id: CORS-901
    title: Origin reflection with credentials and sensitive headers
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and exposes or permits sensitive headers.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and one or more sensitive headers are exposed or permitted.
    suggestion: |
      Try payload `Origin: https://attacker.example` with any sensitive request header such as `Authorization`.
      Check whether sensitive header values are readable cross-origin.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Expose-Headers: X-Auth-Token


  - id: CORS-902
    title: Origin reflection with credentials and broad methods
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and permits broad cross-origin HTTP methods.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and broad or wildcard HTTP methods are permitted.
    suggestion: |
      Try payload `Origin: https://attacker.example` with `Access-Control-Request-Method: DELETE`, `PUT`, or `PATCH`.
      Check whether state-changing actions are possible cross-origin.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: DELETE
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Allow-Methods: *


  - id: CORS-903
    title: Origin reflection with credentials and wildcard permissions
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and permits wildcard request methods or headers
      through CORS.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      and Access-Control-Allow-Methods or Access-Control-Allow-Headers
      is set to '*'.
    suggestion: |
      Try payload `Origin: https://attacker.example` with any non-simple HTTP method or custom request header.
      Check whether authenticated actions and responses are accessible cross-origin.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Method: DELETE
        Access-Control-Request-Headers: X-Custom-Header
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Allow-Methods: *
        Access-Control-Allow-Headers: *

  - id: CORS-904
    title: Origin reflection with credentials and sensitive headers on both sides
    severity: high
    description: >
      The server reflects an attacker-controlled origin, allows
      credentials, and permits sensitive request headers while exposing
      sensitive response headers through CORS.
    evidence: >
      The supplied Origin is reflected, credentials are allowed,
      one or more sensitive request headers are permitted by
      Access-Control-Allow-Headers, and one or more sensitive response
      headers are exposed through Access-Control-Expose-Headers.
    suggestion: |
      Try payload `Origin: https://attacker.example` with `Access-Control-Request-Headers: Authorization`.
      Check whether sensitive authenticated data or exposed response header values can be read cross-origin.
    note: >
      If the target validates the origin against a trusted domain,
      replace the example origin with a domain trusted by the target.
    example:
      request: |
        Origin: https://attacker.example
        Access-Control-Request-Headers: Authorization
      response: |
        Access-Control-Allow-Origin: https://attacker.example
        Access-Control-Allow-Credentials: true
        Access-Control-Allow-Headers: Authorization
        Access-Control-Expose-Headers: X-Auth-Token