# Since the header is hardcoded in cors.py, idk wtf I'm supposed to do with this, but I'll just keep it here.
header:
  high_priority:
    - "Authorization"
    - "Content-Type"
    - "X-Requested-With"

  medium_priority:
    - "X-API-Key"
    - "X-Auth-Token"
    - "X-Access-Token"
    - "X-Refresh-Token"
    - "X-CSRF-Token"

  low_priority:
    - "X-Client-ID"
    - "X-Custom-Header"